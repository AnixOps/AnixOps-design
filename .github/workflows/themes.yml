name: themes

# Generates a version theme (brand/brand.md 2.7) for every product major release that has none yet and
# opens a pull request with it. Needs the secret THEME_REPO_TOKEN: a fine-grained token with read-only
# "Contents" on the private product repositories (anix-control, anix-agent).
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: themes

jobs:
  themes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy && sudo apt-get install -y -qq ffmpeg
      - name: Instrument samples (VSCO 2 Community Edition, CC0)
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/sgossner/VSCO-2-CE "$RUNNER_TEMP/vsco"
          git -C "$RUNNER_TEMP/vsco" sparse-checkout set "Keys/Upright Piano" "Strings/Harp" \
            "Strings/Violin Section/susVib" "Strings/Viola Section/susvib" "Strings/Cello Section/susvib" \
            "Strings/Solo Contrabass/Pizz"
      - name: Generate missing themes
        env:
          THEME_REPO_TOKEN: ${{ secrets.THEME_REPO_TOKEN }}
        run: python3 scripts/theme/update.py --work "$RUNNER_TEMP/products" --samples "$RUNNER_TEMP/vsco"
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add brand/assets/audio
          git diff --cached --quiet && exit 0
          branch="themes/$(date -u +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -qm "feat: version themes for new major releases"
          git push -q -u origin "$branch"
          gh pr create --title "Version themes for new major releases" \
            --body "Generated by the themes workflow. Listen before merging; the .json next to each theme records the release statistics and every parameter. Copy the .mp3 to the website (src/assets/audio) after merging."
